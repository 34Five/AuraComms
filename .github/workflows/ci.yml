name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run has nothing left to prove. Keyed on the ref, so main and each
# branch queue independently and a rapid second push cancels only its own predecessor.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The STEPS live in 34Five/ci-actions and are shared by every repository, so the Bun pin
# and the scan policy are one definition rather than several that happen to agree today.
#
# What stays here is what a composite action cannot set — the runner, the timeout, the
# concurrency group — and the JOB NAMES, which are the strings a branch ruleset matches
# on. Keep them spelled exactly as AuraLayer spells them, so one ruleset can require the
# same two contexts across every repository.
jobs:
  check:
    name: Check (typecheck + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # BOOTSTRAP GUARD — DELETE THIS STEP, THE CHECKOUT ABOVE IT, AND THE `if:` BELOW,
      # IN THE COMMIT THAT ADDS package.json.
      #
      # CI is deliberately in place before the code, so the first PR lands under the gate
      # instead of the gate being retrofitted around work that already merged. Until a
      # `package.json` exists there is nothing to install, typecheck or test, and the
      # shared action would fail on an empty repository rather than on a real fault.
      #
      # A job that passes while proving nothing is its own hazard, so this does not hide:
      # it annotates every run it skips, and the condition closes itself the moment the
      # project is scaffolded. The guard is local on purpose — a temporary state of THIS
      # repository does not belong in an action every repository shares.
      #
      # The checkout exists only because the guard reads the working tree. The shared
      # action does its own, so this goes when the guard does.
      - uses: actions/checkout@v7.0.1
      - name: Project scaffolded yet?
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=CI is not yet proving anything::No package.json in this repository, so typecheck and test were skipped. This guard exists only until the project is scaffolded — delete it, and the if: condition below, in the commit that adds package.json."
          fi
      - uses: 34Five/ci-actions/actions/bun-check@v1
        if: steps.scaffold.outputs.present == 'true'

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Never conditional and never guarded: it costs seconds, and unlike the job above it
    # is fully meaningful from the first commit. Secrets belong in `wrangler secret put`.
    steps:
      - uses: 34Five/ci-actions/actions/secret-scan@v1
